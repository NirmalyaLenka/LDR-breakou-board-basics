<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LDR Code Library — 15 Boards</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090d;--surface:#0f1117;--card:#13161f;--raised:#191d2a;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --accent:#00e5ff;--accent2:#7c3aed;--accent3:#10b981;
  --warn:#f59e0b;--err:#f43f5e;
  --t1:#f1f5f9;--t2:#94a3b8;--t3:#475569;
  --mono:'Space Mono',monospace;
  --display:'Barlow Condensed',sans-serif;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t1);font-family:var(--display);min-height:100vh;overflow-x:hidden}

/* scanline texture */
body::after{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);
  pointer-events:none;z-index:9999
}

.topline{height:2px;background:linear-gradient(90deg,var(--accent2),var(--accent),var(--accent3));width:100%}


header{
  padding:3rem 0 2.5rem;
  border-bottom:1px solid var(--border);
  position:relative;overflow:hidden;
}
header::before{
  content:'';position:absolute;top:-60px;left:-60px;
  width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,229,255,0.06) 0%,transparent 70%);
  pointer-events:none;
}
.container{max-width:1280px;margin:0 auto;padding:0 2rem}
.header-row{display:flex;align-items:flex-end;justify-content:space-between;gap:2rem;flex-wrap:wrap}
.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:0.2em;
  color:var(--accent);text-transform:uppercase;margin-bottom:0.6rem;
  display:flex;align-items:center;gap:10px;
}
.eyebrow::before{content:'';display:block;width:30px;height:1px;background:var(--accent)}
h1{font-size:clamp(2.8rem,5vw,4.5rem);font-weight:800;line-height:1;letter-spacing:-0.01em}
h1 em{font-style:normal;color:var(--accent)}
.header-meta{text-align:right}
.meta-row{font-family:var(--mono);font-size:11px;color:var(--t3);line-height:2}
.meta-row b{color:var(--t2)}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:1rem}
.pill{
  font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:0.06em;padding:4px 12px;border-radius:20px;border:1px solid;
}
.p-cyan {background:rgba(0,229,255,0.08);border-color:rgba(0,229,255,0.3);color:var(--accent)}
.p-purple{background:rgba(124,58,237,0.1);border-color:rgba(124,58,237,0.3);color:#a78bfa}
.p-green {background:rgba(16,185,129,0.08);border-color:rgba(16,185,129,0.3);color:#34d399}
.p-amber {background:rgba(245,158,11,0.08);border-color:rgba(245,158,11,0.3);color:var(--warn)}
.p-red   {background:rgba(244,63,94,0.08); border-color:rgba(244,63,94,0.3); color:#fb7185}

/* ── TOOLBAR ── */
.toolbar{
  position:sticky;top:0;z-index:100;
  background:rgba(8,9,13,0.92);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:0.75rem 0;
}
.toolbar-inner{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--t3)}
#search{
  width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);color:var(--t1);font-family:var(--mono);font-size:12px;
  padding:8px 12px 8px 34px;outline:none;transition:border-color .2s;
}
#search::placeholder{color:var(--t3)}
#search:focus{border-color:var(--accent)}
.filter-row{display:flex;gap:6px;flex-wrap:wrap}
.fb{
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:0.06em;
  background:var(--card);border:1px solid var(--border);border-radius:6px;
  color:var(--t3);padding:6px 12px;cursor:pointer;transition:all .2s;
}
.fb:hover{color:var(--t1);border-color:var(--border2)}
.fb.on{background:var(--accent);border-color:var(--accent);color:#000}
.copy-all{
  margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;
  background:transparent;border:1px solid var(--accent);border-radius:var(--r);
  color:var(--accent);padding:7px 16px;cursor:pointer;transition:all .2s;white-space:nowrap;
}
.copy-all:hover{background:var(--accent);color:#000}

/* ── MAIN GRID ── */
main{padding:2rem 0 4rem}
.boards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem}

/* ── CODE CARD ── */
.code-card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  overflow:hidden;transition:border-color .25s,transform .25s;
  display:flex;flex-direction:column;
}
.code-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.code-card[data-hidden="true"]{display:none}

.card-head{
  padding:1rem 1.25rem 0.875rem;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:0.875rem;
}
.board-icon{
  width:40px;height:40px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
}
.board-name{font-size:15px;font-weight:700;line-height:1.2}
.board-mcu{font-family:var(--mono);font-size:10px;color:var(--t3);margin-top:2px}
.card-badges{margin-left:auto;display:flex;flex-direction:column;gap:4px;align-items:flex-end}

.pin-strip{
  display:flex;gap:6px;padding:0.6rem 1.25rem;
  border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.pchip{
  font-family:var(--mono);font-size:10px;font-weight:700;
  padding:3px 8px;border-radius:5px;border:1px solid;
}
.pchip.vcc{background:rgba(244,63,94,.1); border-color:rgba(244,63,94,.3);color:#fda4af}
.pchip.gnd{background:rgba(71,85,105,.15);border-color:rgba(71,85,105,.4);color:#94a3b8}
.pchip.ao {background:rgba(0,229,255,.08); border-color:rgba(0,229,255,.3);color:var(--accent)}
.pchip.do {background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.3);color:#34d399}

.code-head{
  padding:0.5rem 1rem;display:flex;align-items:center;justify-content:space-between;
  background:var(--raised);border-bottom:1px solid var(--border);
}
.lang-tag{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:0.1em}
.lang-c   {color:var(--accent)}
.lang-py  {color:#facc15}
.btn-row{display:flex;gap:6px}
.cbtn{
  font-family:var(--mono);font-size:10px;background:none;
  border:1px solid var(--border);border-radius:5px;color:var(--t3);
  padding:3px 10px;cursor:pointer;transition:all .2s;
}
.cbtn:hover{border-color:var(--accent);color:var(--accent)}
.cbtn.done{border-color:var(--accent3);color:var(--accent3)}

pre.code{
  padding:1rem 1.25rem;margin:0;
  font-family:var(--mono);font-size:11.5px;line-height:1.75;
  color:var(--t2);overflow-x:auto;max-height:320px;overflow-y:auto;
  background:var(--card);flex:1;
}
pre.code::-webkit-scrollbar{width:4px;height:4px}
pre.code::-webkit-scrollbar-track{background:var(--card)}
pre.code::-webkit-scrollbar-thumb{background:var(--raised);border-radius:2px}

/* syntax */
.tk-c  {color:var(--t3)}
.tk-kw {color:#c084fc}
.tk-nm {color:#fb923c}
.tk-st {color:#86efac}
.tk-fn {color:#67e8f9}
.tk-df {color:#fbbf24}
.tk-pp {color:#f472b6}
.tk-op {color:#94a3b8}

.card-foot{
  padding:0.6rem 1.25rem;
  background:rgba(245,158,11,0.04);
  border-top:1px solid rgba(245,158,11,0.12);
  font-family:var(--mono);font-size:10px;color:#fcd34d;line-height:1.5;
}
.card-foot::before{content:'⚠ '}

.dl-btn{
  display:block;width:calc(100% - 2.5rem);margin:0.75rem 1.25rem 0.875rem;
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:0.05em;
  background:transparent;border:1px solid var(--border);border-radius:var(--r);
  color:var(--t2);padding:8px;cursor:pointer;transition:all .2s;text-align:center;
}
.dl-btn:hover{border-color:var(--accent3);color:var(--accent3);background:rgba(16,185,129,0.06)}

/* ── FOOTER ── */
footer{
  border-top:1px solid var(--border);padding:1.5rem 0;
  font-family:var(--mono);font-size:11px;color:var(--t3);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;
}
.count-display{color:var(--t2)}
.count-display b{color:var(--accent)}

.no-match{
  grid-column:1/-1;text-align:center;padding:4rem 2rem;
  font-family:var(--mono);font-size:13px;color:var(--t3);
}
.no-match span{font-size:2rem;display:block;margin-bottom:1rem}
</style>
</head>
<body>
<div class="topline"></div>

<header>
<div class="container">
  <div class="header-row">
    <div>
      <div class="eyebrow">LDR Sensor · Breakout Module</div>
      <h1>Code <em>Library</em><br>15 Boards</h1>
      <div class="pill-row">
        <span class="pill p-cyan">Arduino IDE</span>
        <span class="pill p-purple">MicroPython</span>
        <span class="pill p-green">3.3V Boards</span>

</div>
</header>

<div class="toolbar">
<div class="container">
  <div class="toolbar-inner">
    <div class="search-wrap">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>

    </div>
    <button class="copy-all" id="copy-all-btn">⬇ Download All</button>
  </div>
</div>
</div>

<main>
<div class="container">
  <div class="boards-grid" id="grid"></div>
</div>
</main>

<footer>
<div class="container" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;width:100%">
  <span class="count-display">Showing <b id="vis-count">15</b> / 15 boards</span>
  <span>LDR Breakout · VCC GND AO DO · All codes MIT licensed</span>
</div>
</footer>

<script>
const BOARDS = [
{
  id:'esp32', name:'ESP32 DevKit V1', mcu:'Xtensa LX6 · 240 MHz',
  icon:'🔵', iconBg:'rgba(59,130,246,.15)',
  tags:['3v3','xtensa'], vcc:'3.3V', ao:'GPIO 34', doPin:'GPIO 35',
  adcBits:'12-bit', voltage:'3.3V',
  warn:'GPIO 34 & 35 are input-only pins — perfect for reading, cannot be driven as output.',
  lang:'C/Arduino',
  file:'esp32_ldr.ino',
  code:`/*
 * ESP32 DevKit V1 — LDR Breakout Board
 * Wiring:
 *   VCC  → 3.3V
 *   GND  → GND
 *   AO   → GPIO 34  (input-only ADC pin)
 *   DO   → GPIO 35  (input-only digital pin)
 */
#define LDR_AO  34
#define LDR_DO  35

void setup() {
  Serial.begin(115200);
  analogReadResolution(12);       // 0–4095
  analogSetAttenuation(ADC_11db); // Full 3.3V range
  pinMode(LDR_DO, INPUT);

  Serial.println("== ESP32 LDR Ready ==");
}

String classify(int v) {
  if (v <  800) return "BRIGHT";
  if (v < 2000) return "NORMAL";
  if (v < 3000) return "DIM";
  return "DARK";
}

void loop() {
  int   raw   = analogRead(LDR_AO);
  float volt  = raw / 4095.0 * 3.3;
  int   pct   = map(raw, 0, 4095, 100, 0);
  bool  dark  = digitalRead(LDR_DO);

  Serial.printf("ADC:%4d  V:%.3f  Lux%%:%3d  %s  DO:%s\\n",
    raw, volt, pct, classify(raw).c_str(),
    dark ? "DARK" : "BRIGHT");

  delay(1000);
}`
},
{
  id:'uno', name:'Arduino Uno R3', mcu:'ATmega328P · 16 MHz',
  icon:'🟢', iconBg:'rgba(16,185,129,.15)',
  tags:['5v','avr'], vcc:'5V', ao:'A0', doPin:'D2',
  adcBits:'10-bit', voltage:'5V',
  warn:'5V logic board. LDR module must support 5V supply. ADC range 0–1023.',
  lang:'C/Arduino',
  file:'uno_ldr.ino',
  code:`/*
 * Arduino Uno R3 — LDR Breakout Board
 * Wiring:
 *   VCC  → 5V
 *   GND  → GND
 *   AO   → A0
 *   DO   → D2  (interrupt-capable pin)
 */
const int LDR_AO = A0;
const int LDR_DO = 2;

void setup() {
  Serial.begin(9600);
  pinMode(LDR_DO, INPUT);
  Serial.println("== Uno LDR Ready ==");
}

String classify(int v) {
  if (v <  200) return "BRIGHT";
  if (v <  500) return "NORMAL";
  if (v <  750) return "DIM";
  return "DARK";
}

void loop() {
  int   raw  = analogRead(LDR_AO);     // 0–1023
  float volt = raw / 1023.0 * 5.0;
  int   pct  = map(raw, 0, 1023, 100, 0);
  bool  dark = digitalRead(LDR_DO);

  Serial.print("ADC:"); Serial.print(raw);
  Serial.print("  V:"); Serial.print(volt, 3);
  Serial.print("  %:"); Serial.print(pct);
  Serial.print("  ");   Serial.print(classify(raw));
  Serial.print("  DO:"); Serial.println(dark ? "DARK" : "BRIGHT");

  delay(1000);
}`
},
{
  id:'nano', name:'Arduino Nano', mcu:'ATmega328P · 16 MHz',
  icon:'🟡', iconBg:'rgba(245,158,11,.15)',
  tags:['5v','avr'], vcc:'5V', ao:'A0', doPin:'D4',
  adcBits:'10-bit', voltage:'5V',
  warn:'Same ATmega328P as Uno. Mini-B USB. A0–A7 all usable.',
  lang:'C/Arduino',
  file:'nano_ldr.ino',
  code:`/*
 * Arduino Nano — LDR Breakout Board
 * Wiring:
 *   VCC  → 5V
 *   GND  → GND
 *   AO   → A0
 *   DO   → D4
 */
const int LDR_AO = A0;
const int LDR_DO = 4;

void setup() {
  Serial.begin(9600);
  pinMode(LDR_DO, INPUT);
  Serial.println("== Nano LDR Ready ==");
}

void loop() {
  int   raw  = analogRead(LDR_AO);
  float volt = raw / 1023.0 * 5.0;
  int   pct  = map(raw, 0, 1023, 100, 0);
  bool  dark = digitalRead(LDR_DO);

  // CSV format for Serial Plotter
  Serial.print(raw);  Serial.print(",");
  Serial.print(volt, 3); Serial.print(",");
  Serial.print(pct); Serial.print(",");
  Serial.println(dark ? 1 : 0);

  delay(500);
}`
},
{
  id:'mega', name:'Arduino Mega 2560', mcu:'ATmega2560 · 16 MHz',
  icon:'🔴', iconBg:'rgba(239,68,68,.15)',
  tags:['5v','avr'], vcc:'5V', ao:'A0', doPin:'D22',
  adcBits:'10-bit', voltage:'5V',
  warn:'16 analog inputs available (A0–A15). Large board — ideal for multi-sensor projects.',
  lang:'C/Arduino',
  file:'mega_ldr.ino',
  code:`/*
 * Arduino Mega 2560 — LDR Breakout Board
 * Wiring:
 *   VCC  → 5V
 *   GND  → GND
 *   AO   → A0  (16 analog pins available)
 *   DO   → D22
 */
const int LDR_AO = A0;
const int LDR_DO = 22;

void setup() {
  Serial.begin(115200);
  pinMode(LDR_DO, INPUT);
  Serial.println("== Mega 2560 LDR Ready ==");
  Serial.println("ADC,Voltage,Percent,Digital");
}

void loop() {
  int   raw  = analogRead(LDR_AO);    // 0–1023
  float volt = raw / 1023.0 * 5.0;
  int   pct  = map(raw, 0, 1023, 100, 0);
  bool  dark = digitalRead(LDR_DO);

  Serial.print(raw);      Serial.print(",");
  Serial.print(volt, 3);  Serial.print(",");
  Serial.print(pct);      Serial.print(",");
  Serial.println(dark ? "DARK" : "BRIGHT");

  delay(1000);
}`
},
{
  id:'esp8266', name:'NodeMCU ESP8266', mcu:'Xtensa L106 · 80 MHz',
  icon:'🌐', iconBg:'rgba(6,182,212,.15)',
  tags:['3v3','xtensa'], vcc:'3.3V', ao:'A0', doPin:'D5',
  adcBits:'10-bit (1ch)', voltage:'3.3V',
  warn:'A0 max input = 1.0V (on-board divider). Single analog channel only. DO → D5 (GPIO14).',
  lang:'C/Arduino',
  file:'esp8266_ldr.ino',
  code:`/*
 * NodeMCU ESP8266 — LDR Breakout Board
 * Wiring:
 *   VCC  → 3.3V
 *   GND  → GND
 *   AO   → A0    (ONLY analog pin; max 1.0V at pin)
 *   DO   → D5    (GPIO 14)
 *
 * IMPORTANT: ESP8266 A0 has internal 100k/220k divider.
 * Module AO typically outputs 0–3.3V → safe with divider.
 */
const int LDR_AO = A0;    // GPIO ADC0
const int LDR_DO = D5;    // GPIO 14

void setup() {
  Serial.begin(115200);
  pinMode(LDR_DO, INPUT);
  Serial.println("== ESP8266 LDR Ready ==");
}

void loop() {
  int   raw  = analogRead(LDR_AO);    // 0–1023, 0–1.0V range
  float volt = raw / 1023.0 * 1.0;   // Actual voltage at pin
  int   pct  = map(raw, 0, 1023, 100, 0);
  bool  dark = digitalRead(LDR_DO);

  Serial.printf("ADC:%4d  V:%.3f  %%:%3d  DO:%s\\n",
    raw, volt, pct, dark ? "DARK" : "BRIGHT");

  delay(1000);
}`
},
{
  id:'pico', name:'Raspberry Pi Pico', mcu:'RP2040 Dual M0+ · 133 MHz',
  icon:'🍓', iconBg:'rgba(236,72,153,.15)',
  tags:['3v3','arm','py'], vcc:'3.3V', ao:'GP26 (ADC0)', doPin:'GP16',
  adcBits:'12-bit', voltage:'3.3V',
  warn:'Only GP26, GP27, GP28 are ADC pins. MicroPython shown — use Pico SDK for C/C++.',
  lang:'MicroPython',
  file:'pico_ldr.py',
  code:`# Raspberry Pi Pico — LDR Breakout Board
# Wiring:
#   VCC  → 3.3V  (pin 36)
#   GND  → GND   (pin 38)
#   AO   → GP26  (ADC0, pin 31)
#   DO   → GP16  (pin 21)

from machine import ADC, Pin
import time

ldr_ao = ADC(26)              # GP26 = ADC0
ldr_do = Pin(16, Pin.IN)      # GP16 digital input

def classify(raw16):
    # raw16 is 0–65535 (16-bit from read_u16)
    pct = 100 - int(raw16 / 65535 * 100)
    if pct > 75: return "BRIGHT"
    if pct > 50: return "NORMAL"
    if pct > 25: return "DIM"
    return "DARK"

print("== Pico LDR Ready ==")
print("raw16, raw12, voltage, percent, digital")

while True:
    raw16  = ldr_ao.read_u16()          # 0–65535
    raw12  = raw16 >> 4                  # scale to 12-bit
    volt   = raw16 / 65535 * 3.3
    pct    = 100 - int(raw16 / 65535 * 100)
    dark   = ldr_do.value()

    print(f"{raw16:5d}, {raw12:4d}, {volt:.3f}V, {pct:3d}%, "
          f"{'DARK' if dark else 'BRIGHT'}, {classify(raw16)}")
    time.sleep(1)`
},
{
  id:'stm32', name:'STM32 Blue Pill', mcu:'STM32F103C8 · 72 MHz',
  icon:'💙', iconBg:'rgba(59,130,246,.15)',
  tags:['3v3','arm'], vcc:'3.3V', ao:'PA0', doPin:'PB0',
  adcBits:'12-bit', voltage:'3.3V',
  warn:'3.3V I/O ONLY — not 5V tolerant on most pins. Use STM32duino board package. Check boot0 pin.',
  lang:'C/Arduino',
  file:'stm32_bluepill_ldr.ino',
  code:`/*
 * STM32 Blue Pill (STM32F103C8) — LDR Breakout
 * Board Package: STM32duino (STM32 cores)
 * Wiring:
 *   VCC  → 3.3V
 *   GND  → GND
 *   AO   → PA0  (ADC_IN0)
 *   DO   → PB0
 *
 * WARNING: 3.3V I/O only on most pins!
 */
const int LDR_AO = PA0;
const int LDR_DO = PB0;

void setup() {

// ── Syntax highlighter ──────────────────────────────────────
function hl(raw) {
  const e = raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return e
    .replace(/(\/\/[^\n]*|#[^\n]*(?=\n)|"""[\s\S]*?""")/g, '<span class="tk-c">$1</span>')
    .replace(/\b(void|const|int|float|bool|true|false|String|define|include|return|while|if|else|for|class|struct|namespace|using|nullptr|auto|from|import|as|def|while|pass)\b/g,'<span class="tk-kw">$1</span>')
    .replace(/\b([0-9]+\.?[0-9]*)\b/g,'<span class="tk-nm">$1</span>')
    .replace(/"([^"\\]|\\.)*"/g,'<span class="tk-st">$&</span>')
    .replace(/\b(Serial|analogRead|digitalRead|analogReadResolution|analogSetAttenuation|analogReadAveraging|pinMode|map|printf|print|println|delay|time\.sleep|ADC|Pin|f|format|value|read_u16|DigiUSB)\b/g,'<span class="tk-fn">$1</span>')
    .replace(/\b(setup|loop|classify|begin)\b/g,'<span class="tk-df">$1</span>');
}

// ── Render ──────────────────────────────────────────────────
let activeFilter = 'all';

function renderGrid(list) {
  const grid = document.getElementById('grid');
  document.getElementById('vis-count').textContent = list.length;
  if (!list.length) {
    grid.innerHTML = '<div class="no-match"><span>🔦</span>No boards match — try a different filter.</div>';
    return;
  }
  grid.innerHTML = list.map(b => `
<div class="code-card" data-id="${b.id}">
  <div class="card-head">
    <div class="board-icon" style="background:${b.iconBg}">${b.icon}</div>
    <div style="flex:1;min-width:0">
      <div class="board-name">${b.name}</div>
      <div class="board-mcu">${b.mcu}</div>
    </div>
    <div class="card-badges">
      <span class="pill ${b.voltage==='5V'?'p-amber':'p-cyan'}" style="font-size:9px;padding:2px 8px">${b.voltage}</span>
      <span class="pill p-purple" style="font-size:9px;padding:2px 8px">${b.adcBits}</span>
    </div>
  </div>
  <div class="pin-strip">
    <span class="pchip vcc">VCC→${b.vcc}</span>
    <span class="pchip gnd">GND→GND</span>
    <span class="pchip ao">AO→${b.ao}</span>
    <span class="pchip do">DO→${b.doPin}</span>
  </div>
  <div class="code-head">
    <span class="lang-tag ${b.lang.includes('Python')?'lang-py':'lang-c'}">${b.lang}</span>
    <div class="btn-row">
      <button class="cbtn" onclick="copyCode('${b.id}',this)">Copy</button>
    </div>
  </div>
  <pre class="code" id="pre-${b.id}">${hl(b.code)}</pre>
  <div class="card-foot">${b.warn}</div>
  <button class="dl-btn" onclick="downloadCode('${b.id}')">⬇ Download ${b.file}</button>
</div>`).join('');
}

function copyCode(id, btn) {
  const b = BOARDS.find(x => x.id === id);
  navigator.clipboard.writeText(b.code).then(() => {
    btn.textContent = '✓ Copied';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 2000);
  });
}

function downloadCode(id) {
  const b = BOARDS.find(x => x.id === id);
  const blob = new Blob([b.code], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = b.file;
  a.click();
}

// Download all as ZIP-like bundle (individual files concatenated with headers)
document.getElementById('copy-all-btn').addEventListener('click', () => {
  const all = BOARDS.map(b =>
    `${'='.repeat(60)}\n// FILE: ${b.file}\n// BOARD: ${b.name}\n// MCU: ${b.mcu}\n${'='.repeat(60)}\n\n${b.code}\n\n`
  ).join('\n');
  const blob = new Blob([all], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ldr_all_boards.txt';
  a.click();
});

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  return BOARDS.filter(b => {
    const fMatch = activeFilter === 'all' || b.tags.includes(activeFilter);
    const sMatch = !q || b.name.toLowerCase().includes(q) || b.mcu.toLowerCase().includes(q) || b.id.includes(q);
    return fMatch && sMatch;
  });
}

document.getElementById('search').addEventListener('input', () => renderGrid(getFiltered()));

document.querySelectorAll('.fb').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.fb').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    activeFilter = btn.dataset.f;
    renderGrid(getFiltered());
  });
});

renderGrid(BOARDS);
</script>
